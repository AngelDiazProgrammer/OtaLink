# API de OtaLink -> servicio otalink-api en 127.0.0.1:5100
server {
    listen 80;
    listen [::]:80;
    server_name api.otalink.test;

    server_tokens off;
    access_log /var/log/nginx/otalink-api.access.log;
    error_log  /var/log/nginx/otalink-api.error.log warn;

    # Fotos de perfil
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:5100;
        include snippets/otalink-proxy.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # SignalR: conexiones largas, sin buffering.
    location /hubs/ {
        proxy_pass http://127.0.0.1:5100;
        include snippets/otalink-proxy.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    error_page 502 503 504 = @no_disponible;
    location @no_disponible {
        default_type application/json;
        return 503 '{"error":"service_unavailable"}';
    }
}
