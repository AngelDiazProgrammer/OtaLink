# Web de OtaLink (Blazor) -> servicio otalink-web en 127.0.0.1:5000
server {
    listen 80;
    listen [::]:80;
    server_name otalink.test;

    server_tokens off;
    access_log /var/log/nginx/otalink-web.access.log;
    error_log  /var/log/nginx/otalink-web.error.log warn;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        include snippets/otalink-proxy.conf;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # TODO: al elegir el modo de renderizado de Blazor, añadir aquí el bloque
    # de /_blazor (WebSocket con proxy_read_timeout largo) si hace falta.

    error_page 502 503 504 /otalink-no-disponible;
    location = /otalink-no-disponible {
        internal;
        default_type text/plain;
        return 503 "OtaLink no esta disponible en este momento.\n";
    }
}
