# Cabeceras comunes para reenviar a los servicios .NET.
# Los tiempos de espera se definen en cada location (no aquí) para poder
# cambiarlos sin que Nginx rechace la directiva duplicada.
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Se sobrescribe (no se acumula) para que el cliente no pueda falsear su IP.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSockets / SignalR
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

